name: Post Note to Substack

on:
  schedule:
    - cron: "0 1 * * *"    # 1am UTC (9pm ET / 2am London)
  workflow_dispatch:         # allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Post next note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PURIFAI_FEED_URL: ${{ secrets.PURIFAI_FEED_URL }}
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
        run: python main.py post

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: mark note as posted"
          git push
